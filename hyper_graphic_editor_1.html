<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC-6001mkII 15色ドット絵エディタ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", "Hiragino Sans", "Meiryo", sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }

    h1 {
      font-size: 1.2rem;
      margin-bottom: 10px;
      color: #a0d2ff;
      font-weight: 600;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      background: #16213e;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 10px;
      max-width: 900px;
      width: 100%;
    }

    .toolbar button, .toolbar select {
      background: #0f3460;
      color: #eee;
      border: 1px solid #533483;
      border-radius: 5px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.15s;
    }

    .toolbar button:hover, .toolbar select:hover {
      background: #533483;
    }

    .toolbar button.active {
      background: #e94560;
      border-color: #e94560;
    }

    .toolbar label {
      font-size: 0.85rem;
      color: #aaa;
    }

    .current-color {
      width: 28px;
      height: 28px;
      border: 2px solid #fff;
      border-radius: 4px;
      display: inline-block;
      vertical-align: middle;
    }

    .canvas-wrapper {
      background: #0d0d1a;
      border: 2px solid #533483;
      border-radius: 6px;
      padding: 8px;
      overflow: auto;
      max-width: 100%;
    }

    #mainCanvas {
      display: block;
      image-rendering: pixelated;
      cursor: crosshair;
      background: #000;
    }

    .palette {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 12px;
      padding: 10px;
      background: #16213e;
      border-radius: 8px;
      max-width: 900px;
      width: 100%;
      justify-content: center;
    }

    .palette-color {
      width: 32px;
      height: 32px;
      border: 2px solid #333;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .palette-color:hover {
      transform: scale(1.15);
    }

    .palette-color.selected {
      border-color: #fff;
      box-shadow: 0 0 0 2px #e94560;
    }

    .status {
      margin-top: 8px;
      font-size: 0.8rem;
      color: #888;
    }

    .pattern-options {
      display: none;
      gap: 6px;
      align-items: center;
    }

    .pattern-options.visible {
      display: flex;
    }
  </style>
</head>
<body>
  <h1>PC-6001mkII 15色ドット絵エディタ</h1>

  <div class="toolbar">
    <button id="btnPen" class="active">ペン</button>
    <button id="btnFill">塗りつぶし</button>

    <div class="pattern-options" id="patternOptions">
      <label>パターン:</label>
      <select id="patternSelect">
        <option value="solid">原色（ベタ塗り）</option>
        <option value="checker">市松模様</option>
        <option value="hstripe">横ストライプ</option>
        <option value="vstripe">縦ストライプ</option>
        <option value="dots">ドット</option>
      </select>
    </div>

    <label>拡大:</label>
    <select id="zoomSelect">
      <option value="2">2倍</option>
      <option value="3">3倍</option>
      <option value="4" selected>4倍</option>
      <option value="6">6倍</option>
    </select>

    <label>現在色:</label>
    <span class="current-color" id="currentColorDisplay"></span>

    <button id="btnClear">全消し</button>
    <button id="btnUndo">アンドゥ</button>
  </div>

  <div class="canvas-wrapper">
    <canvas id="mainCanvas" width="160" height="200"></canvas>
  </div>

  <div class="palette" id="palette"></div>

  <div class="status" id="status">ペンツール | 160×200 | 横長ドット表示</div>

  <script>
    // ===== 設定 =====
    const COLS = 160;
    const ROWS = 200;

    // 描きやすさ優先の15色パレット
    const PALETTE = [
      { name: "黒",       color: "#000000" },
      { name: "暗い青",   color: "#0000aa" },
      { name: "青",       color: "#0055ff" },
      { name: "水色",     color: "#55aaff" },
      { name: "暗い緑",   color: "#005500" },
      { name: "緑",       color: "#00aa00" },
      { name: "黄緑",     color: "#55ff55" },
      { name: "茶色",     color: "#aa5500" },
      { name: "オレンジ", color: "#ff8800" },
      { name: "赤",       color: "#ff0000" },
      { name: "ピンク",   color: "#ff55aa" },
      { name: "紫",       color: "#aa00ff" },
      { name: "灰色",     color: "#555555" },
      { name: "明灰",     color: "#aaaaaa" },
      { name: "白",       color: "#ffffff" }
    ];

    // ===== 状態 =====
    let pixels = new Uint8Array(COLS * ROWS); // 色インデックス (0-14)
    let currentColor = 14; // 白
    let currentTool = "pen";
    let currentPattern = "solid";
    let zoom = 4;
    let isDrawing = false;
    let undoStack = [];
    const MAX_UNDO = 30;

    // ===== DOM =====
    const canvas = document.getElementById("mainCanvas");
    const ctx = canvas.getContext("2d");
    const paletteEl = document.getElementById("palette");
    const currentColorDisplay = document.getElementById("currentColorDisplay");
    const statusEl = document.getElementById("status");
    const patternOptions = document.getElementById("patternOptions");

    // ===== 初期化 =====
    function init() {
      // パレット生成
      PALETTE.forEach((p, i) => {
        const div = document.createElement("div");
        div.className = "palette-color" + (i === currentColor ? " selected" : "");
        div.style.background = p.color;
        div.title = p.name;
        div.dataset.index = i;
        div.addEventListener("click", () => selectColor(i));
        paletteEl.appendChild(div);
      });

      updateCurrentColorDisplay();
      resizeCanvas();
      clearCanvas(false);
      render();

      // イベント
      document.getElementById("btnPen").addEventListener("click", () => setTool("pen"));
      document.getElementById("btnFill").addEventListener("click", () => setTool("fill"));
      document.getElementById("patternSelect").addEventListener("change", (e) => {
        currentPattern = e.target.value;
        updateStatus();
      });
      document.getElementById("zoomSelect").addEventListener("change", (e) => {
        zoom = parseInt(e.target.value, 10);
        resizeCanvas();
        render();
      });
      document.getElementById("btnClear").addEventListener("click", () => {
        if (confirm("キャンバスをすべて消去しますか？")) {
          pushUndo();
          clearCanvas(true);
          render();
        }
      });
      document.getElementById("btnUndo").addEventListener("click", undo);

      canvas.addEventListener("mousedown", onPointerDown);
      canvas.addEventListener("mousemove", onPointerMove);
      canvas.addEventListener("mouseup", onPointerUp);
      canvas.addEventListener("mouseleave", onPointerUp);

      // タッチ対応
      canvas.addEventListener("touchstart", (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const mouseEvent = new MouseEvent("mousedown", {
          clientX: touch.clientX,
          clientY: touch.clientY
        });
        canvas.dispatchEvent(mouseEvent);
      }, { passive: false });

      canvas.addEventListener("touchmove", (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const mouseEvent = new MouseEvent("mousemove", {
          clientX: touch.clientX,
          clientY: touch.clientY
        });
        canvas.dispatchEvent(mouseEvent);
      }, { passive: false });

      canvas.addEventListener("touchend", () => {
        const mouseEvent = new MouseEvent("mouseup");
        canvas.dispatchEvent(mouseEvent);
      });
    }

    function selectColor(index) {
      currentColor = index;
      document.querySelectorAll(".palette-color").forEach((el, i) => {
        el.classList.toggle("selected", i === index);
      });
      updateCurrentColorDisplay();
      updateStatus();
    }

    function updateCurrentColorDisplay() {
      currentColorDisplay.style.background = PALETTE[currentColor].color;
    }

    function setTool(tool) {
      currentTool = tool;
      document.getElementById("btnPen").classList.toggle("active", tool === "pen");
      document.getElementById("btnFill").classList.toggle("active", tool === "fill");
      patternOptions.classList.toggle("visible", tool === "fill");
      updateStatus();
    }

    function updateStatus() {
      const toolName = currentTool === "pen" ? "ペン" : "塗りつぶし";
      const patternName = currentPattern === "solid" ? "" : ` (${document.getElementById("patternSelect").selectedOptions[0].text})`;
      statusEl.textContent = `${toolName}${patternName} | 色: ${PALETTE[currentColor].name} | ${COLS}×${ROWS} | 拡大 ${zoom}倍 | 横長ドット表示`;
    }

    function resizeCanvas() {
      // 横長ドット再現のため、横方向の表示サイズを大きめにする
      const displayWidth = COLS * zoom * 1.6; // 横に少し伸ばす
      const displayHeight = ROWS * zoom;
      canvas.style.width = displayWidth + "px";
      canvas.style.height = displayHeight + "px";
      canvas.width = COLS;
      canvas.height = ROWS;
    }

    function clearCanvas(renderAfter = true) {
      pixels.fill(0); // 黒
      if (renderAfter) render();
    }

    function pushUndo() {
      undoStack.push(new Uint8Array(pixels));
      if (undoStack.length > MAX_UNDO) undoStack.shift();
    }

    function undo() {
      if (undoStack.length === 0) return;
      pixels = undoStack.pop();
      render();
    }

    function getIndex(x, y) {
      return y * COLS + x;
    }

    function setPixel(x, y, colorIndex) {
      if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return;
      pixels[getIndex(x, y)] = colorIndex;
    }

    function getPixel(x, y) {
      if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return -1;
      return pixels[getIndex(x, y)];
    }

    // タイリングパターンで色を決定
    function getTiledColor(x, y, mainColor, subColor = 0) {
      switch (currentPattern) {
        case "checker":
          return ((x + y) % 2 === 0) ? mainColor : subColor;
        case "hstripe":
          return (y % 2 === 0) ? mainColor : subColor;
        case "vstripe":
          return (x % 2 === 0) ? mainColor : subColor;
        case "dots":
          return ((x % 3 === 1) && (y % 3 === 1)) ? mainColor : subColor;
        default:
          return mainColor;
      }
    }

    // 洪水塗りつぶし
    function floodFill(startX, startY) {
      const targetColor = getPixel(startX, startY);
      if (targetColor === -1) return;

      // 原色塗りで同じ色なら何もしない
      if (currentPattern === "solid" && targetColor === currentColor) return;

      const stack = [[startX, startY]];
      const visited = new Uint8Array(COLS * ROWS);

      while (stack.length > 0) {
        const [x, y] = stack.pop();
        const idx = getIndex(x, y);
        if (visited[idx]) continue;
        if (getPixel(x, y) !== targetColor) continue;

        visited[idx] = 1;

        const drawColor = currentPattern === "solid"
          ? currentColor
          : getTiledColor(x, y, currentColor, 0); // サブ色は黒固定（後で拡張可）

        setPixel(x, y, drawColor);

        stack.push([x + 1, y]);
        stack.push([x - 1, y]);
        stack.push([x, y + 1]);
        stack.push([x, y - 1]);
      }
    }

    function canvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = COLS / rect.width;
      const scaleY = ROWS / rect.height;
      const x = Math.floor((e.clientX - rect.left) * scaleX);
      const y = Math.floor((e.clientY - rect.top) * scaleY);
      return { x, y };
    }

    function onPointerDown(e) {
      const { x, y } = canvasCoords(e);
      if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return;

      pushUndo();

      if (currentTool === "pen") {
        isDrawing = true;
        setPixel(x, y, currentColor);
        render();
      } else if (currentTool === "fill") {
        floodFill(x, y);
        render();
      }
    }

    function onPointerMove(e) {
      if (!isDrawing || currentTool !== "pen") return;
      const { x, y } = canvasCoords(e);
      setPixel(x, y, currentColor);
      render();
    }

    function onPointerUp() {
      isDrawing = false;
    }

    function render() {
      const imageData = ctx.createImageData(COLS, ROWS);
      const data = imageData.data;

      for (let i = 0; i < pixels.length; i++) {
        const c = PALETTE[pixels[i]].color;
        const r = parseInt(c.slice(1, 3), 16);
        const g = parseInt(c.slice(3, 5), 16);
        const b = parseInt(c.slice(5, 7), 16);
        const offset = i * 4;
        data[offset] = r;
        data[offset + 1] = g;
        data[offset + 2] = b;
        data[offset + 3] = 255;
      }

      ctx.putImageData(imageData, 0, 0);
    }

    // 起動
    init();
    updateStatus();
  </script>
</body>
</html>
